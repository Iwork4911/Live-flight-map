<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Live Flight Tracker</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --chrome: rgba(255, 255, 255, .82);
      --chrome-solid: #ffffff;
      --text: #152238;
      --muted: #64748b;
      --border: rgba(100, 116, 139, .2);
      --shadow: 0 10px 32px rgba(15, 23, 42, .1);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, .11);
      --focus: rgba(37, 99, 235, .28);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --page: #0b1220;
      --chrome: rgba(15, 23, 42, .84);
      --chrome-solid: #0f172a;
      --text: #e5edf9;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, .2);
      --shadow: 0 12px 34px rgba(0, 0, 0, .28);
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, .13);
      --focus: rgba(96, 165, 250, .3);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 280px;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100%;
      isolation: isolate;
    }
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 68px;
      padding: .75rem clamp(1rem, 3vw, 2rem);
      border-bottom: 1px solid var(--border);
      background: var(--chrome);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      backdrop-filter: blur(18px) saturate(150%);
    }
    .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, #2563eb, #14b8a6);
      box-shadow: 0 7px 18px rgba(37, 99, 235, .28);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(.95rem, 2vw, 1.08rem);
      font-weight: 700;
      letter-spacing: -.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .eyebrow {
      margin: .16rem 0 0;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .actions { display: flex; align-items: center; justify-content: flex-end; gap: .55rem; flex: 0 0 auto; }
    .button, .external-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .42rem;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--chrome-solid);
      font: inherit;
      font-size: .8rem;
      font-weight: 650;
      text-decoration: none;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .button { width: 38px; cursor: pointer; }
    .external-link { padding: 0 .78rem; }
    .button:hover, .external-link:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .button:focus-visible, .external-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .icon { width: 17px; height: 17px; }
    .map-wrap { position: relative; min-height: 0; background: #dbe5ef; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #dbe5ef; }
    .status-note {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .45rem;
      max-width: calc(100% - 2rem);
      padding: .42rem .65rem;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      color: #334155;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 5px 20px rgba(15, 23, 42, .12);
      font-size: .7rem;
      font-weight: 650;
      pointer-events: none;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, .17); }
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: .42rem 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      background: var(--chrome);
      font-size: .68rem;
      text-align: center;
    }
    .footer a { color: var(--accent); font-weight: 650; }
    @media (max-width: 560px) {
      .topbar { min-height: 62px; padding-inline: .8rem; }
      .brand { gap: .58rem; }
      .brand-mark { width: 32px; height: 32px; border-radius: 9px; }
      .brand-mark svg { width: 18px; height: 18px; }
      .external-link { padding-inline: .62rem; }
      .external-link span { display: none; }
      .status-note { right: .6rem; bottom: .6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12.5 21 5l-5.7 14-3.1-6.1L3 12.5Z" />
            <path d="m12.2 12.9 3.1-3.1" />
          </svg>
        </div>
        <div>
          <h1>Live Flight Tracker</h1>
          <p class="eyebrow">Real-time air traffic</p>
        </div>
      </div>
      <nav class="actions" aria-label="Tracker actions">
        <a class="external-link" href="https://globe.adsbexchange.com/" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
          <span>Open on ADS-B Exchange</span>
        </a>
        <button class="button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
          <svg class="icon" id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
      </nav>
    </header>
    <main class="map-wrap" aria-label="Live flight map">
      <iframe src="https://globe.adsbexchange.com/" title="Live flight tracking map from ADS-B Exchange" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="status-note" aria-hidden="true"><span class="status-dot"></span>Live map</div>
    </main>
    <footer class="footer">
      Embedded wrapper · Live data and map UI by <a href="https://www.adsbexchange.com/" target="_blank" rel="noopener noreferrer">ADS-B Exchange</a>
    </footer>
  </div>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const icon = document.getElementById("theme-icon");
      const metaTheme = document.querySelector("meta[name=theme-color]");
      const storageKey = "adsb-tracker-theme";
      const sun = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>`;
      const moon = `<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>`;
      let saved = null;
      try { saved = localStorage.getItem(storageKey); } catch (_) {}
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      let theme = saved === "dark" || saved === "light" ? saved : (systemDark ? "dark" : "light");
      function render() {
        const dark = theme === "dark";
        root.dataset.theme = theme;
        icon.innerHTML = dark ? sun : moon;
        toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
        toggle.setAttribute("title", dark ? "Switch to light mode" : "Switch to dark mode");
        metaTheme.setAttribute("content", dark ? "#0b1220" : "#f4f7fb");
      }
      toggle.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        try { localStorage.setItem(storageKey, theme); } catch (_) {}
        render();
      });
      render();
    })();
  </script>
</body>
</html>
